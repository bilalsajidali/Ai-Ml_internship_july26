 let student = {

 console.log(student.course);

 if (student.marks >= 80) {

    // YOUR CODE HERE
  let counter = 0;

        counter++;
        this.innerHTML = "Clicked " + counter + " times";
    };


    // Q35. Toggle button:
    //      When  #toggle-btn  is clicked, show/hide  #secret

    // YOUR CODE HERE
 document.getElementById("toggle-btn").onclick = function() {

    };



    // Q36. Form handling:
    //      When  #signup-form  is submitted:
    //        - stop the page from reloading  (event.preventDefault())
    //        - read the name and email values
    //        - if either is empty, write  "Please fill in all fields"
    //          into  #output
    //        - otherwise write  "Thanks, <name>! We will email <email>."
    //          into  #output
    // YOUR CODE HERE
document.getElementById("signup-form").onsubmit = function(event) {
        event.preventDefault();

        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let output = document.getElementById("output");

        if (name == "" || email == "") {
            output.innerHTML = "Please fill in all fields";
        } else {
            output.innerHTML = `Thanks, ${name}! We will email ${email}.`;
        }
    };

  Q48. What is a merge conflict, and how do you fix one?
       YOUR ANSWER HERE:
A merge conflict happens when Git cannot automatically combine changes made to 
the same part of a file. We fix it by opening the file, choosing the correct changes,
 and then committing the file.

to ignore Python cache files.
